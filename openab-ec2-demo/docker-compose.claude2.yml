# Scenario C: 2x Claude
services:
  agent-claude-1:
    image: openab-claude:latest
    container_name: openab-claude-1
    restart: unless-stopped
    env_file: .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - claude1-home:/home/node
      - ./config/.rendered/claude1.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-claude-2:
    image: openab-claude:latest
    container_name: openab-claude-2
    restart: unless-stopped
    env_file: .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - claude2-home:/home/node
      - ./config/.rendered/claude2.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  claude1-home:
  claude2-home:
