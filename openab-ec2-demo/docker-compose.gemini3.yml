# Scenario B: 3x Gemini
services:
  agent-gemini-1:
    image: openab-gemini:latest
    container_name: openab-gemini-1
    restart: unless-stopped
    env_file: .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - gemini1-home:/home/node
      - ./config/.rendered/gemini1.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-gemini-2:
    image: openab-gemini:latest
    container_name: openab-gemini-2
    restart: unless-stopped
    env_file: .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - gemini2-home:/home/node
      - ./config/.rendered/gemini2.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-gemini-3:
    image: openab-gemini:latest
    container_name: openab-gemini-3
    restart: unless-stopped
    env_file: .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - gemini3-home:/home/node
      - ./config/.rendered/gemini3.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gemini1-home:
  gemini2-home:
  gemini3-home:
