# OpenAB 4-Agent Demo — Docker Compose
services:
  agent-kiro:
    image: ghcr.io/openabdev/openab:latest
    container_name: openab-kiro
    restart: unless-stopped
    env_file: .env
    environment:
      - KIRO_API_KEY=${KIRO_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - kiro-home:/home/agent
      - ./config/.rendered/kiro.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-claude:
    image: ghcr.io/openabdev/openab-claude:latest
    container_name: openab-claude
    restart: unless-stopped
    env_file: .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - claude-home:/home/node
      - ./config/.rendered/claude.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-gemini:
    image: ghcr.io/openabdev/openab-gemini:latest
    container_name: openab-gemini
    restart: unless-stopped
    env_file: .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - gemini-home:/home/node
      - ./config/.rendered/gemini.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-codex:
    image: ghcr.io/openabdev/openab-codex:latest
    container_name: openab-codex
    restart: unless-stopped
    env_file: .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
    volumes:
      - codex-home:/home/node
      - ./config/.rendered/codex.toml:/etc/openab/config.toml:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "openab"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kiro-home:
  claude-home:
  gemini-home:
  codex-home:
