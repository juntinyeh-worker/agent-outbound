AWSTemplateFormatVersion: '2010-09-09'
Description: Video Thumbnail Generator (MOV/MP4) - FFmpeg Lambda

Parameters:
  PhotoBucketName:
    Type: String
    Description: Photo/video S3 bucket name (first bucket if comma-separated)

Resources:
  VideoThumbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${PhotoBucketName}'
                  - !Sub 'arn:aws:s3:::${PhotoBucketName}/*'

  VideoThumbFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: video-thumbnail-generator
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt VideoThumbRole.Arn
      Layers:
        - !Ref FfmpegLayer
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': '{}'}

  FfmpegLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: ffmpeg-layer
      CompatibleRuntimes: [python3.12]
      Content:
        S3Bucket: !Ref LayerBucket
        S3Key: ffmpeg-layer.zip

  LayerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # --- S3 Event Notification for video uploads ---
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::${PhotoBucketName}'
      SourceAccount: !Ref AWS::AccountId

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Notification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}'

  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt NotificationRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutBucketNotificationConfigurationCommand, GetBucketNotificationConfigurationCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();
          exports.handler = async (event, context) => {
            const bucket = event.ResourceProperties.BUCKET;
            const lambdaArn = event.ResourceProperties.LAMBDA_ARN;
            const suffixes = ['.mov', '.mp4', '.avi', '.mkv', '.webm', '.m4v'];
            try {
              if (event.RequestType === 'Delete') {
                const existing = await s3.send(new GetBucketNotificationConfigurationCommand({ Bucket: bucket }));
                const configs = (existing.LambdaFunctionConfigurations || []).filter(c => c.LambdaFunctionArn !== lambdaArn);
                await s3.send(new PutBucketNotificationConfigurationCommand({
                  Bucket: bucket,
                  NotificationConfiguration: {
                    LambdaFunctionConfigurations: configs,
                    TopicConfigurations: existing.TopicConfigurations || [],
                    QueueConfigurations: existing.QueueConfigurations || []
                  }
                }));
                await response.send(event, context, response.SUCCESS, {});
                return;
              }
              const existing = await s3.send(new GetBucketNotificationConfigurationCommand({ Bucket: bucket }));
              const configs = (existing.LambdaFunctionConfigurations || []).filter(c => c.LambdaFunctionArn !== lambdaArn);
              for (const suffix of suffixes) {
                configs.push({
                  LambdaFunctionArn: lambdaArn,
                  Events: ['s3:ObjectCreated:*'],
                  Filter: { Key: { FilterRules: [{ Name: 'suffix', Value: suffix }] }}
                });
              }
              await s3.send(new PutBucketNotificationConfigurationCommand({
                Bucket: bucket,
                NotificationConfiguration: {
                  LambdaFunctionConfigurations: configs,
                  TopicConfigurations: existing.TopicConfigurations || [],
                  QueueConfigurations: existing.QueueConfigurations || []
                }
              }));
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetVideoNotification:
    Type: Custom::S3VideoNotification
    DependsOn: S3InvokePermission
    Properties:
      ServiceToken: !GetAtt NotificationFunction.Arn
      BUCKET: !Ref PhotoBucketName
      LAMBDA_ARN: !GetAtt VideoThumbFunction.Arn

  # --- API Gateway (manual trigger) ---
  VideoThumbApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: video-thumbnail-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: ['*']

  VideoThumbIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref VideoThumbApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt VideoThumbFunction.Arn
      PayloadFormatVersion: '2.0'

  VideoThumbRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref VideoThumbApi
      RouteKey: POST /generate
      Target: !Sub 'integrations/${VideoThumbIntegration}'

  VideoThumbStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref VideoThumbApi
      StageName: '$default'
      AutoDeploy: true

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${VideoThumbApi}/*'

Outputs:
  VideoThumbApiUrl:
    Value: !Sub 'https://${VideoThumbApi}.execute-api.${AWS::Region}.amazonaws.com/generate'
  LayerBucket:
    Value: !Ref LayerBucket
