AWSTemplateFormatVersion: '2010-09-09'
Description: Video Thumbnail Generator (MOV/MP4) - FFmpeg Lambda

Parameters:
  PhotoBucketName:
    Type: String
    Description: Comma-separated list of S3 bucket names

Resources:
  VideoThumbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource: '*'

  VideoThumbFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: video-thumbnail-generator
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt VideoThumbRole.Arn
      Layers:
        - !Ref FfmpegLayer
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': '{}'}

  VideoThumbFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref VideoThumbFunction
      Cors:
        AllowOrigins: ['*']
        AllowMethods: [POST]
        AllowHeaders: ['*']

  VideoThumbUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  FfmpegLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: ffmpeg-layer
      CompatibleRuntimes: [python3.12]
      Content:
        S3Bucket: !Ref LayerBucket
        S3Key: ffmpeg-layer.zip

  LayerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # --- S3 Event Notification for video uploads ---
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Notification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: 'arn:aws:s3:::*'

  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt NotificationRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutBucketNotificationConfigurationCommand, GetBucketNotificationConfigurationCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();
          exports.handler = async (event, context) => {
            const buckets = event.ResourceProperties.BUCKET.split(',').map(b => b.trim()).filter(Boolean);
            const lambdaArn = event.ResourceProperties.LAMBDA_ARN;
            const suffixes = ['.mov', '.mp4', '.avi', '.mkv', '.webm', '.m4v'];
            try {
              for (const bucket of buckets) {
                const existing = await s3.send(new GetBucketNotificationConfigurationCommand({ Bucket: bucket }));
                const configs = (existing.LambdaFunctionConfigurations || []).filter(c => c.LambdaFunctionArn !== lambdaArn);
                if (event.RequestType !== 'Delete') {
                  for (const suffix of suffixes) {
                    configs.push({
                      LambdaFunctionArn: lambdaArn,
                      Events: ['s3:ObjectCreated:*'],
                      Filter: { Key: { FilterRules: [{ Name: 'suffix', Value: suffix }] }}
                    });
                  }
                }
                await s3.send(new PutBucketNotificationConfigurationCommand({
                  Bucket: bucket,
                  NotificationConfiguration: {
                    LambdaFunctionConfigurations: configs,
                    TopicConfigurations: existing.TopicConfigurations || [],
                    QueueConfigurations: existing.QueueConfigurations || []
                  }
                }));
              }
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetVideoNotification:
    Type: Custom::S3VideoNotification
    DependsOn: S3InvokePermission
    Properties:
      ServiceToken: !GetAtt NotificationFunction.Arn
      BUCKET: !Ref PhotoBucketName
      LAMBDA_ARN: !GetAtt VideoThumbFunction.Arn

Outputs:
  VideoThumbApiUrl:
    Value: !GetAtt VideoThumbFunctionUrl.FunctionUrl
  LayerBucket:
    Value: !Ref LayerBucket
