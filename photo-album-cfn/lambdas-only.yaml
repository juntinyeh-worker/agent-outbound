AWSTemplateFormatVersion: '2010-09-09'
Description: Photo Album Lambdas - standalone (no layers, no API Gateway)

Parameters:
  PhotoBucketName:
    Type: String
    Description: Existing photo S3 bucket name

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: photo-album-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource: '*'

  ThumbnailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: thumbnail-generator
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - will be updated with actual code + Pillow layer
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  RotateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-rotate
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  BurstDetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: burst-detector
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  VideoThumbnailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: video-thumbnail-generator
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ThumbnailFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  ThumbnailArn:
    Value: !GetAtt ThumbnailFunction.Arn
  RotateArn:
    Value: !GetAtt RotateFunction.Arn
  BurstDetectorArn:
    Value: !GetAtt BurstDetectorFunction.Arn
  VideoThumbnailArn:
    Value: !GetAtt VideoThumbnailFunction.Arn
