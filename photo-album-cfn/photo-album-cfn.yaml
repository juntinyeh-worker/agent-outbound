AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Photo Album - CloudFront + Cognito + existing photo bucket

Parameters:
  PhotoBucketName:
    Type: String
    Description: Name of your S3 bucket for photos (will be created if it doesn't exist)
  AdminEmail:
    Type: String
    Description: Admin email (will receive temporary password)
  CreatePhotoBucket:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create the photo bucket

Conditions:
  ShouldCreateBucket: !Equals [!Ref CreatePhotoBucket, 'true']
  UseExistingBucket: !Not [!Equals [!Ref CreatePhotoBucket, 'true']]

Resources:
  # --- Photo Bucket (created only if requested) ---
  PhotoBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
      BucketName: !Ref PhotoBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET, PUT, DELETE, HEAD]
            AllowedHeaders: ['*']
            MaxAgeSeconds: 3600
  # --- Site Bucket ---
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- CloudFront OAC ---
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- CloudFront Distribution ---
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false

  # --- Site Bucket Policy for CloudFront ---
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # --- Cognito User Pool ---
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-UserPool'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # --- Cognito Groups ---
  ViewersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Viewers
      RoleArn: !GetAtt ViewerRole.Arn
      Precedence: 2

  EditorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Editors
      RoleArn: !GetAtt EditorRole.Arn
      Precedence: 1

  # --- Identity Pool ---
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # --- IAM Roles ---
  ViewerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: ViewerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}/*'

  EditorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: EditorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}/*'

  # --- Identity Pool Role Attachment ---
  RoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt ViewerRole.Arn
      RoleMappings:
        mapping:
          Type: Token
          AmbiguousRoleResolution: AuthenticatedRole
          IdentityProvider: !Sub '${UserPool.ProviderName}:${UserPoolClient}'

  # --- Seed Admin User (Lambda Custom Resource) ---
  SeedUserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAdmin
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                Resource: !GetAtt UserPool.Arn

  SeedUserFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt SeedUserRole.Arn
      Code:
        ZipFile: |
          const { CognitoIdentityProviderClient, AdminCreateUserCommand, AdminAddUserToGroupCommand } = require('@aws-sdk/client-cognito-identity-provider');
          const response = require('cfn-response');
          const client = new CognitoIdentityProviderClient();
          exports.handler = async (event, context) => {
            if (event.RequestType === 'Delete') {
              await response.send(event, context, response.SUCCESS, {});
              return;
            }
            const { USER_POOL_ID, EMAIL, GROUP_NAME } = event.ResourceProperties;
            try {
              await client.send(new AdminCreateUserCommand({
                UserPoolId: USER_POOL_ID,
                Username: EMAIL,
                UserAttributes: [{ Name: 'email', Value: EMAIL }, { Name: 'email_verified', Value: 'true' }],
                DesiredDeliveryMediums: ['EMAIL'],
              }));
            } catch (e) {
              if (e.name !== 'UsernameExistsException') {
                await response.send(event, context, response.FAILED, { Error: e.message });
                return;
              }
            }
            await client.send(new AdminAddUserToGroupCommand({
              UserPoolId: USER_POOL_ID,
              Username: EMAIL,
              GroupName: GROUP_NAME,
            }));
            await response.send(event, context, response.SUCCESS, {});
          };

  SeedAdminUser:
    Type: Custom::SeedUser
    Properties:
      ServiceToken: !GetAtt SeedUserFunction.Arn
      USER_POOL_ID: !Ref UserPool
      EMAIL: !Ref AdminEmail
      GROUP_NAME: Editors

  # --- Set CORS on existing photo bucket ---
  BucketCorsRole:
    Type: AWS::IAM::Role
    Condition: UseExistingBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Cors
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketCors
                  - s3:GetBucketCors
                Resource: !Sub 'arn:aws:s3:::${PhotoBucketName}'

  BucketCorsFunction:
    Type: AWS::Lambda::Function
    Condition: UseExistingBucket
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt BucketCorsRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutBucketCorsCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();
          exports.handler = async (event, context) => {
            if (event.RequestType === 'Delete') {
              await response.send(event, context, response.SUCCESS, {});
              return;
            }
            try {
              await s3.send(new PutBucketCorsCommand({
                Bucket: event.ResourceProperties.BUCKET,
                CORSConfiguration: {
                  CORSRules: [{
                    AllowedOrigins: ['*'],
                    AllowedMethods: ['GET', 'PUT', 'DELETE', 'HEAD'],
                    AllowedHeaders: ['*'],
                    MaxAgeSeconds: 3600
                  }]
                }
              }));
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetBucketCors:
    Type: Custom::BucketCors
    Condition: UseExistingBucket
    Properties:
      ServiceToken: !GetAtt BucketCorsFunction.Arn
      BUCKET: !Ref PhotoBucketName

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${Distribution.DomainName}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Value: !Ref IdentityPool
  PhotoBucket:
    Value: !Ref PhotoBucketName
  SiteBucket:
    Value: !Ref SiteBucket
