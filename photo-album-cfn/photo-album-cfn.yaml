AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Photo Album - Parent stack with nested Lambda stacks

Parameters:
  PhotoBucketName:
    Type: String
    Description: Comma-separated list of S3 bucket names for photos
  AdminEmail:
    Type: String
    Description: Admin email (will receive temporary password)
  CreatePhotoBucket:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  TemplateBucket:
    Type: String
    Description: S3 bucket containing nested stack templates

Conditions:
  ShouldCreateBucket: !Equals [!Ref CreatePhotoBucket, 'true']
  UseExistingBucket: !Not [!Equals [!Ref CreatePhotoBucket, 'true']]

Resources:
  # --- Photo Bucket (created only if requested) ---
  PhotoBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
      BucketName: !Ref PhotoBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET, PUT, DELETE, HEAD]
            AllowedHeaders: ['*']
            MaxAgeSeconds: 3600

  # --- Site Bucket ---
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- CloudFront OAC ---
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- CloudFront Distribution ---
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # --- Cognito User Pool ---
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-UserPool'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  ViewersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Viewers
      RoleArn: !GetAtt ViewerRole.Arn
      Precedence: 2

  EditorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Editors
      RoleArn: !GetAtt EditorRole.Arn
      Precedence: 1

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # --- IAM Roles ---
  ViewerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated

  EditorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated

  BucketPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IAMPolicyManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource:
                  - !GetAtt ViewerRole.Arn
                  - !GetAtt EditorRole.Arn

  BucketPolicyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt BucketPolicyRole.Arn
      Code:
        ZipFile: |
          const { IAMClient, PutRolePolicyCommand, DeleteRolePolicyCommand } = require('@aws-sdk/client-iam');
          const response = require('cfn-response');
          const iam = new IAMClient();
          exports.handler = async (event, context) => {
            const { VIEWER_ROLE, EDITOR_ROLE, BUCKETS } = event.ResourceProperties;
            const bucketList = BUCKETS.split(',').map(b => b.trim()).filter(Boolean);
            try {
              if (event.RequestType === 'Delete') {
                await iam.send(new DeleteRolePolicyCommand({ RoleName: VIEWER_ROLE, PolicyName: 'BucketAccess' })).catch(() => {});
                await iam.send(new DeleteRolePolicyCommand({ RoleName: EDITOR_ROLE, PolicyName: 'BucketAccess' })).catch(() => {});
                await response.send(event, context, response.SUCCESS, {});
                return;
              }
              const bucketArns = bucketList.map(b => `arn:aws:s3:::${b}`);
              const objectArns = bucketList.map(b => `arn:aws:s3:::${b}/*`);
              const viewerPolicy = JSON.stringify({
                Version: '2012-10-17',
                Statement: [
                  { Effect: 'Allow', Action: 's3:ListBucket', Resource: bucketArns },
                  { Effect: 'Allow', Action: 's3:GetObject', Resource: objectArns }
                ]
              });
              const editorPolicy = JSON.stringify({
                Version: '2012-10-17',
                Statement: [
                  { Effect: 'Allow', Action: 's3:ListBucket', Resource: bucketArns },
                  { Effect: 'Allow', Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject'], Resource: objectArns }
                ]
              });
              await iam.send(new PutRolePolicyCommand({ RoleName: VIEWER_ROLE, PolicyName: 'BucketAccess', PolicyDocument: viewerPolicy }));
              await iam.send(new PutRolePolicyCommand({ RoleName: EDITOR_ROLE, PolicyName: 'BucketAccess', PolicyDocument: editorPolicy }));
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetBucketPolicies:
    Type: Custom::BucketPolicies
    Properties:
      ServiceToken: !GetAtt BucketPolicyFunction.Arn
      VIEWER_ROLE: !Ref ViewerRole
      EDITOR_ROLE: !Ref EditorRole
      BUCKETS: !Ref PhotoBucketName

  RoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt ViewerRole.Arn
      RoleMappings:
        mapping:
          Type: Token
          AmbiguousRoleResolution: AuthenticatedRole
          IdentityProvider: !Sub '${UserPool.ProviderName}:${UserPoolClient}'

  # --- Seed Admin User ---
  SeedUserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAdmin
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                Resource: !GetAtt UserPool.Arn

  SeedUserFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt SeedUserRole.Arn
      Code:
        ZipFile: |
          const { CognitoIdentityProviderClient, AdminCreateUserCommand, AdminAddUserToGroupCommand } = require('@aws-sdk/client-cognito-identity-provider');
          const response = require('cfn-response');
          const client = new CognitoIdentityProviderClient();
          exports.handler = async (event, context) => {
            if (event.RequestType === 'Delete') {
              await response.send(event, context, response.SUCCESS, {});
              return;
            }
            const { USER_POOL_ID, EMAIL, GROUP_NAME } = event.ResourceProperties;
            try {
              await client.send(new AdminCreateUserCommand({
                UserPoolId: USER_POOL_ID,
                Username: EMAIL,
                UserAttributes: [{ Name: 'email', Value: EMAIL }, { Name: 'email_verified', Value: 'true' }],
                DesiredDeliveryMediums: ['EMAIL'],
              }));
            } catch (e) {
              if (e.name !== 'UsernameExistsException') {
                await response.send(event, context, response.FAILED, { Error: e.message });
                return;
              }
            }
            await client.send(new AdminAddUserToGroupCommand({
              UserPoolId: USER_POOL_ID,
              Username: EMAIL,
              GroupName: GROUP_NAME,
            }));
            await response.send(event, context, response.SUCCESS, {});
          };

  SeedAdminUser:
    Type: Custom::SeedUser
    Properties:
      ServiceToken: !GetAtt SeedUserFunction.Arn
      USER_POOL_ID: !Ref UserPool
      EMAIL: !Ref AdminEmail
      GROUP_NAME: Editors

  # --- CORS on existing bucket ---
  BucketCorsRole:
    Type: AWS::IAM::Role
    Condition: UseExistingBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Cors
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketCors
                  - s3:GetBucketCors
                Resource: 'arn:aws:s3:::*'

  BucketCorsFunction:
    Type: AWS::Lambda::Function
    Condition: UseExistingBucket
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt BucketCorsRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutBucketCorsCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();
          exports.handler = async (event, context) => {
            if (event.RequestType === 'Delete') {
              await response.send(event, context, response.SUCCESS, {});
              return;
            }
            try {
              const buckets = event.ResourceProperties.BUCKETS.split(',').map(b => b.trim()).filter(Boolean);
              for (const bucket of buckets) {
                await s3.send(new PutBucketCorsCommand({
                  Bucket: bucket,
                  CORSConfiguration: {
                    CORSRules: [{
                      AllowedOrigins: ['*'],
                      AllowedMethods: ['GET', 'PUT', 'DELETE', 'HEAD'],
                      AllowedHeaders: ['*'],
                      MaxAgeSeconds: 3600
                    }]
                  }
                }));
              }
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetBucketCors:
    Type: Custom::BucketCors
    Condition: UseExistingBucket
    Properties:
      ServiceToken: !GetAtt BucketCorsFunction.Arn
      BUCKETS: !Ref PhotoBucketName

  # ==========================================
  # NESTED STACKS — Lambda Functions
  # ==========================================

  RotateStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/stacks/rotate-cfn.yaml'
      Parameters:
        PhotoBucketName: !Ref PhotoBucketName

  ThumbnailStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/stacks/thumbnail-cfn.yaml'
      Parameters:
        PhotoBucketName: !Ref PhotoBucketName

  BurstDetectorStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/stacks/burst-detector-cfn.yaml'
      Parameters:
        PhotoBucketName: !Ref PhotoBucketName

  VideoThumbnailStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/stacks/video-thumbnail-cfn.yaml'
      Parameters:
        PhotoBucketName: !Ref PhotoBucketName

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${Distribution.DomainName}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Value: !Ref IdentityPool
  PhotoBucket:
    Value: !Ref PhotoBucketName
  SiteBucket:
    Value: !Ref SiteBucket
  RotateApiUrl:
    Value: !GetAtt RotateStack.Outputs.RotateApiUrl
  ThumbnailApiUrl:
    Value: !GetAtt ThumbnailStack.Outputs.ThumbnailApiUrl
  BurstApiUrl:
    Value: !GetAtt BurstDetectorStack.Outputs.BurstApiUrl
  VideoThumbnailApiUrl:
    Value: !GetAtt VideoThumbnailStack.Outputs.VideoThumbApiUrl
