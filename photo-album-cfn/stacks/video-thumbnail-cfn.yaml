AWSTemplateFormatVersion: '2010-09-09'
Description: Video Thumbnail Generator - FFmpeg Lambda (nested stack)

Parameters:
  PhotoBucketName:
    Type: String
    Description: Comma-separated list of S3 bucket names

Resources:
  VideoThumbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource: '*'

  LayerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  VideoThumbFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: video-thumbnail-generator
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 1024
      EphemeralStorage:
        Size: 2048
      Role: !GetAtt VideoThumbRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': '{}'}

  # --- API Gateway REST API ---
  VideoThumbApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: video-thumbnail-api

  VideoThumbResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VideoThumbApi
      ParentId: !GetAtt VideoThumbApi.RootResourceId
      PathPart: generate

  VideoThumbMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VideoThumbApi
      ResourceId: !Ref VideoThumbResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VideoThumbFunction.Arn}/invocations'

  VideoThumbOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VideoThumbApi
      ResourceId: !Ref VideoThumbResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  VideoThumbDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [VideoThumbMethod, VideoThumbOptionsMethod]
    Properties:
      RestApiId: !Ref VideoThumbApi
      StageName: prod

  VideoThumbApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${VideoThumbApi}/*'

  # --- S3 invoke permission (allow any S3 bucket to trigger) ---
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoThumbFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # --- Custom resource to set S3 notifications on ALL buckets ---
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Notification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: 'arn:aws:s3:::*'

  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt NotificationRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutBucketNotificationConfigurationCommand, GetBucketNotificationConfigurationCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();
          exports.handler = async (event, context) => {
            const buckets = event.ResourceProperties.BUCKETS.split(',').map(b => b.trim()).filter(Boolean);
            const lambdaArn = event.ResourceProperties.LAMBDA_ARN;
            const suffixes = ['.mov', '.mp4', '.avi', '.mkv', '.webm', '.m4v'];
            try {
              for (const bucket of buckets) {
                if (event.RequestType === 'Delete') {
                  const existing = await s3.send(new GetBucketNotificationConfigurationCommand({ Bucket: bucket }));
                  const configs = (existing.LambdaFunctionConfigurations || []).filter(c => c.LambdaFunctionArn !== lambdaArn);
                  await s3.send(new PutBucketNotificationConfigurationCommand({
                    Bucket: bucket,
                    NotificationConfiguration: {
                      LambdaFunctionConfigurations: configs,
                      TopicConfigurations: existing.TopicConfigurations || [],
                      QueueConfigurations: existing.QueueConfigurations || []
                    }
                  }));
                } else {
                  const existing = await s3.send(new GetBucketNotificationConfigurationCommand({ Bucket: bucket }));
                  const configs = (existing.LambdaFunctionConfigurations || []).filter(c => c.LambdaFunctionArn !== lambdaArn);
                  for (const suffix of suffixes) {
                    configs.push({
                      LambdaFunctionArn: lambdaArn,
                      Events: ['s3:ObjectCreated:*'],
                      Filter: { Key: { FilterRules: [{ Name: 'suffix', Value: suffix }] }}
                    });
                  }
                  await s3.send(new PutBucketNotificationConfigurationCommand({
                    Bucket: bucket,
                    NotificationConfiguration: {
                      LambdaFunctionConfigurations: configs,
                      TopicConfigurations: existing.TopicConfigurations || [],
                      QueueConfigurations: existing.QueueConfigurations || []
                    }
                  }));
                }
              }
              await response.send(event, context, response.SUCCESS, {});
            } catch (e) {
              await response.send(event, context, response.FAILED, { Error: e.message });
            }
          };

  SetVideoNotification:
    Type: Custom::S3VideoNotification
    DependsOn: S3InvokePermission
    Properties:
      ServiceToken: !GetAtt NotificationFunction.Arn
      BUCKETS: !Ref PhotoBucketName
      LAMBDA_ARN: !GetAtt VideoThumbFunction.Arn

Outputs:
  VideoThumbApiUrl:
    Value: !Sub 'https://${VideoThumbApi}.execute-api.${AWS::Region}.amazonaws.com/prod/generate'
  LayerBucket:
    Value: !Ref LayerBucket
