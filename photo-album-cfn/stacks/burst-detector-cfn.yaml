AWSTemplateFormatVersion: '2010-09-09'
Description: Burst Photo Detector Lambda (nested stack)

Parameters:
  PhotoBucketName:
    Type: String

Resources:
  LayerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DepsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: burst-detector-deps
      Description: Pillow, imagehash, exifread, numpy, scipy
      CompatibleRuntimes: [python3.12]
      Content:
        S3Bucket: !Ref LayerBucket
        S3Key: burst-detector-layer.zip

  BurstDetectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'

  BurstDetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: burst-detector
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 300
      MemorySize: 1024
      Role: !GetAtt BurstDetectorRole.Arn
      Layers:
        - !Ref DepsLayer
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': '{}'}

  # --- API Gateway REST API ---
  BurstApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: burst-detector-api

  BurstResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BurstApi
      ParentId: !GetAtt BurstApi.RootResourceId
      PathPart: scan

  BurstMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BurstApi
      ResourceId: !Ref BurstResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BurstDetectorFunction.Arn}/invocations'

  BurstOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BurstApi
      ResourceId: !Ref BurstResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  BurstDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [BurstMethod, BurstOptionsMethod]
    Properties:
      RestApiId: !Ref BurstApi
      StageName: prod

  BurstApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BurstDetectorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BurstApi}/*'

Outputs:
  BurstApiUrl:
    Value: !Sub 'https://${BurstApi}.execute-api.${AWS::Region}.amazonaws.com/prod/scan'
  LayerBucket:
    Value: !Ref LayerBucket
