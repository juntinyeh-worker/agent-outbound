AWSTemplateFormatVersion: '2010-09-09'
Description: Photo Rotate Lambda (nested stack)

Parameters:
  PhotoBucketName:
    Type: String

Resources:
  RotateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: '*'

  RotateLayerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  RotateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: photo-rotate
      Runtime: python3.12
      Handler: lambda_function.handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt RotateRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {'statusCode': 200, 'body': '{}'}

  # --- API Gateway REST API ---
  RotateApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: photo-rotate-api

  RotateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RotateApi
      ParentId: !GetAtt RotateApi.RootResourceId
      PathPart: rotate

  RotateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RotateApi
      ResourceId: !Ref RotateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RotateFunction.Arn}/invocations'

  RotateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RotateApi
      ResourceId: !Ref RotateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  RotateDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RotateMethod, RotateOptionsMethod]
    Properties:
      RestApiId: !Ref RotateApi
      StageName: prod

  RotateApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RotateFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RotateApi}/*'

Outputs:
  RotateApiUrl:
    Value: !Sub 'https://${RotateApi}.execute-api.${AWS::Region}.amazonaws.com/prod/rotate'
  RotateLayerBucket:
    Value: !Ref RotateLayerBucket
