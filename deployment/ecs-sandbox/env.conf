# ============================================================================
# OpenAB ECS Sandbox Deployment — Environment Configuration
# ============================================================================
# Copy this file to .env and fill in your values.
# All resources are prefixed with "sandbox-" for isolation.

# --- Region Configuration ---
# ECS_REGION: Where ECS cluster, tasks, and ECR repositories are deployed.
# SANDBOX_REGION: Where the ECS task role has admin access to sandbox-* resources.
ECS_REGION="us-west-2"
SANDBOX_REGION="us-east-1"

# --- AWS Account ---
AWS_ACCOUNT_ID="256358067059"

# --- Naming ---
# All resources will be prefixed with this value.
RESOURCE_PREFIX="sandbox"
STACK_NAME="${RESOURCE_PREFIX}-openab-infra"

# --- ECS Configuration ---
ECS_CLUSTER_NAME="${RESOURCE_PREFIX}-openab"
ECS_SERVICE_NAME="${RESOURCE_PREFIX}-openab-telegram"
ECS_TASK_FAMILY="${RESOURCE_PREFIX}-openab-telegram"
ECS_CPU="256"
ECS_MEMORY="512"
ECS_DESIRED_COUNT="1"

# --- ECR ---
ECR_REPO_NAME="${RESOURCE_PREFIX}-openab"

# --- Networking ---
# VPC and subnets in the ECS_REGION. Leave empty to use default VPC.
VPC_ID=""
SUBNET_IDS=""  # comma-separated, e.g. "subnet-aaa,subnet-bbb"
ASSIGN_PUBLIC_IP="ENABLED"

# --- OpenAB Agent Configuration ---
# Which agent backend to use: kiro, claude, codex, gemini, strands
AGENT_BACKEND="kiro"
OAB_IMAGE="ghcr.io/openabdev/openab:stable-kiro"

# --- Telegram ---
TELEGRAM_BOT_TOKEN=""
TELEGRAM_ALLOWED_USER_ID=""
TELEGRAM_ALLOW_ALL_USERS="false"

# --- Agent Keys ---
# For Kiro:
KIRO_API_KEY=""
# For Claude:
# ANTHROPIC_API_KEY=""
# For custom Strands (uses Bedrock via task role, no key needed)

# --- Webhook ---
# Leave empty to auto-provision API Gateway in ECS_REGION
WEBHOOK_URL=""
