---
# Ingress to expose both OAB instances for Telegram webhooks.
# Adjust annotations for your ingress controller (nginx, ALB, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openab-telegram
  namespace: openab
  annotations:
    # For AWS ALB:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    #
    # For nginx:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - oab-kiro.example.com
    - oab-strands.example.com
    secretName: openab-tls
  rules:
  # Kiro bot webhook
  - host: oab-kiro.example.com
    http:
      paths:
      - path: /webhook/telegram
        pathType: Prefix
        backend:
          service:
            name: openab-kiro
            port:
              number: 8080
  # Strands bot webhook
  - host: oab-strands.example.com
    http:
      paths:
      - path: /webhook/telegram
        pathType: Prefix
        backend:
          service:
            name: openab-strands
            port:
              number: 8080
