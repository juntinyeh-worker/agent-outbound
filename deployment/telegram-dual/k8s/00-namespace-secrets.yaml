---
apiVersion: v1
kind: Namespace
metadata:
  name: openab
---
# Create this secret manually or via the deploy script:
#   kubectl create secret generic openab-secrets -n openab \
#     --from-literal=telegram-bot-token-kiro="..." \
#     --from-literal=telegram-bot-token-strands="..." \
#     --from-literal=kiro-api-key="..." \
#     --from-literal=telegram-allowed-user-id="..."
apiVersion: v1
kind: Secret
metadata:
  name: openab-secrets
  namespace: openab
type: Opaque
stringData:
  telegram-bot-token-kiro: "REPLACE_ME"
  telegram-bot-token-strands: "REPLACE_ME"
  kiro-api-key: "REPLACE_ME"
  telegram-allowed-user-id: "REPLACE_ME"
  agentcore-runtime-arn: "REPLACE_ME"
