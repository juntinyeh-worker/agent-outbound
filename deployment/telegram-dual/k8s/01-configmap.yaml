---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openab-configs
  namespace: openab
data:
  config-kiro.toml: |
    [telegram]
    bot_token = "${TELEGRAM_BOT_TOKEN_KIRO}"
    allowed_users = ["${TELEGRAM_ALLOWED_USER_ID}"]
    rich_messages = true
    streaming = true

    [agent]
    env = { KIRO_API_KEY = "${KIRO_API_KEY}" }

    [pool]
    max_sessions = 5
    session_ttl_hours = 2

    [reactions]
    enabled = true
    tool_display = "compact"

  config-strands.toml: |
    [telegram]
    bot_token = "${TELEGRAM_BOT_TOKEN_STRANDS}"
    allowed_users = ["${TELEGRAM_ALLOWED_USER_ID}"]
    rich_messages = true
    streaming = true

    [agentcore]
    runtime_arn = "${AGENTCORE_RUNTIME_ARN}"
    shell_command = "python3 /app/acp_wrapper.py"
    cancel_strategy = "stop"

    [pool]
    max_sessions = 5
    session_ttl_hours = 2

    [reactions]
    enabled = true
    tool_display = "compact"
