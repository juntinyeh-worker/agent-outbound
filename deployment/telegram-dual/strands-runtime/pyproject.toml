[project]
name = "strands-acp-runtime"
version = "0.1.0"
description = "Strands Agent ACP wrapper for OpenAB on Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.3.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
